name: Build AppleJuice.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller `
            winrt-runtime `
            winrt-Windows.Devices.Bluetooth `
            winrt-Windows.Storage.Streams

      - name: Build EXE
        run: |
          pyinstaller --noconfirm `
            --onefile `
            --windowed `
            --name "AppleJuice" `
            --hidden-import winrt.windows.devices.bluetooth `
            --hidden-import winrt.windows.devices.bluetooth.advertisement `
            --hidden-import winrt.windows.storage.streams `
            --hidden-import winrt.windows.foundation `
            --hidden-import winrt.windows.foundation.collections `
            --collect-all winrt `
            applejuice_standalone.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleJuice
          path: dist/AppleJuice.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AppleJuice
          body: |
            ## AppleJuice — Apple BLE Proximity Spoofer

            **Just download and run. No Python, no install, no setup.**

            ### Requirements
            - Windows 10 or Windows 11
            - Bluetooth LE adapter (built-in or USB)

            ### First launch
            A one-time setup window will appear for ~30 seconds while BLE drivers install, then the app opens automatically.
          files: dist/AppleJuice.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
